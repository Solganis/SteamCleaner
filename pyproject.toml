[project]
name = "steamcleaner"
version = "1.1.1"
description = "Cross-platform tool for reclaiming disk space from game clients"
requires-python = ">=3.14"  # modern syntax only: match/case, PEP 758 except, | unions, generics in builtins
license = "MIT"
authors = [{name = "Solganis"}]
keywords = ["steam", "epic", "gog", "ubisoft", "ea", "disk-cleanup", "cache-cleaner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# Runtime deps, kept deliberately small: darkdetect = OS light/dark theme detection; flet = GUI framework
# and `flet build` toolchain; send2trash = recoverable deletion to the system trash, the core
# "nothing is permanently removed by default" safety guarantee.
dependencies = [
    "darkdetect>=0.8.0",
    "flet>=0.86.2",
    "send2trash>=2.1.0",
]

[project.urls]
Repository = "https://github.com/Solganis/SteamCleaner"
Issues = "https://github.com/Solganis/SteamCleaner/issues"

# Console entry point: `steamcleaner` launches the GUI.
[project.scripts]
steamcleaner = "steamcleaner.app:main"

# `flet build` release-binary config. org = reverse-DNS bundle identifier baked into the native app;
# product = the display name of the built binary.
[tool.flet]
org = "dev.steamcleaner"
product = "SteamCleaner"

# Where `flet build` finds the app package (src-layout root).
[tool.flet.app]
path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src-layout: the importable package lives under src/, not the repo root.
[tool.hatch.build.targets.wheel]
packages = ["src/steamcleaner"]

[tool.ruff]
# 120 feeds both `ruff format` and the E501 lint; line length is a hard rule, not just a formatter hint.
line-length = 120
target-version = "py314"  # our minimum Python; UP rewrites target this floor

[tool.ruff.lint]
# Opt into preview rules only when named explicitly in `select`, never the whole unstable set.
preview = true
explicit-preview-rules = true

# Curated set, not "ALL": each prefix is here on purpose. Plugin name + why we keep it.
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes - unused imports/names, undefined names
    "W",    # pycodestyle warnings
    "I",    # isort - import ordering
    "N",    # pep8-naming - naming conventions
    "UP",   # pyupgrade - modernize syntax to the py314 floor
    "B",    # flake8-bugbear - likely bugs and footguns
    "A",    # flake8-builtins - don't shadow builtins
    "SIM",  # flake8-simplify - collapse redundant constructs
    "RUF",  # Ruff-specific rules
    "ANN",  # flake8-annotations - require type hints on everything (project rule)
]
# UP037: flet bundles Python 3.12, so forward-ref annotation strings must stay quoted; ANN401: Any is
# needed for the free-form TOML config dicts loaded from ~/.config/steamcleaner/config.toml.
ignore = ["UP037", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/steamcleaner/ui/*" = ["ANN001"]  # flet event-handler params are dynamically typed (no flet stubs)
"tests/*" = ["ANN"]  # tests omit -> None and fixture-param annotations by convention

[tool.ty.environment]
python-version = "3.14"
# "all", not a single OS: SteamCleaner ships a per-OS PlatformAdapter (windows/linux/macos), so ty must
# type-check every platform's code path, not just the CI runner's view (contrast Seekbar, pinned to win32).
python-platform = "all"

[tool.ty.rules]
# Downgrade to warn (not error) globally: flet controls and winreg expose dynamic attributes with no
# stubs, so this rule fires pervasively; the two overrides below silence the files where it is pure noise.
unresolved-attribute = "warn"

# winreg module has no type stubs; all registry access triggers false positives
[[tool.ty.overrides]]
include = ["src/steamcleaner/platform/windows.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# flet controls use dynamic attributes (__init_subclass__, kwargs) with no type stubs
[[tool.ty.overrides]]
include = ["src/steamcleaner/ui/gui/app.py", "src/main.py", "tests/ui/test_persistence.py", "tests/ui/test_logic.py", "tests/ui/test_controls.py", "tests/ui/test_async.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]  # import the package from src/ and shared test helpers from tests/
addopts = "--import-mode=importlib"  # modern import mode: no sys.path insertion, plays well with src-layout

[tool.coverage.run]
branch = true
source = ["steamcleaner"]
# Kept out of the 100% target because they cannot be unit-tested on the runner: ui/* is flet GUI paint;
# windows.py/macos.py call OS-native APIs (winreg, ~/Library) not exercisable on every platform;
# __main__.py and app.py are entry-point wiring. linux.py stays in - pure XDG path logic, DI-testable anywhere.
omit = [
    "src/steamcleaner/ui/*",
    "src/steamcleaner/platform/windows.py",
    "src/steamcleaner/platform/macos.py",
    "src/steamcleaner/__main__.py",
    "src/steamcleaner/app.py",
]

[tool.coverage.report]
# Non-executable or unreachable-by-design lines that should not count against coverage.
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "except OSError",  # defensive IO guards, hard to trigger deterministically
    "pragma: no cover",
    "if self\\.cancelled",  # thread-driven cancellation branches
    "if cancel and cancel\\.is_set",
]

# Dev/test/build tooling (not shipped): linter, type checker, test stack, assertion and property libs.
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ty>=0.0.63",
    "assertpy2>=2.18.0",
    "hypothesis>=6.161.5",
]
