name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        default: windows
        options:
          - windows
          - all

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.platforms }}" != "all" ]]; then
            echo 'matrix={"include":[{"os":"windows-latest","platform":"windows","artifact":"SteamCleaner-windows"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"windows-latest","platform":"windows","artifact":"SteamCleaner-windows"},{"os":"ubuntu-latest","platform":"linux","artifact":"SteamCleaner-linux"},{"os":"macos-15","platform":"macos","artifact":"SteamCleaner-macos"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev ninja-build pkg-config cmake clang
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Cache Flutter SDK and Flet template
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.flet
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: flet-build-${{ matrix.os }}-flet1.0
          restore-keys: flet-build-${{ matrix.os }}-
      - name: Build
        if: matrix.os != 'windows-latest'
        run: uv run flet build "$BUILD_PLATFORM" --yes --no-rich-output -o dist
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          PYTHONIOENCODING: utf-8
      # One command per Windows step: PowerShell reports only the exit code of the last command of a step.
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: uv run flet build windows --yes --no-rich-output
        env:
          PYTHONIOENCODING: utf-8
      - name: Patch the window start (Windows)
        if: matrix.platform == 'windows'
        run: uv run python scripts/build_windows.py --skip-flet-build
        env:
          PYTHONIOENCODING: utf-8
      - name: Prune the Python runtime (Windows)
        if: matrix.platform == 'windows'
        run: uv run python scripts/prune_bundle.py build/windows
      # Every ELF file: filtering on the execute bit left the Flutter engine library with 27 MB of debug info.
      - name: Strip debug symbols (Linux)
        if: matrix.platform == 'linux'
        run: |
          find dist -type f -exec file {} + > built.txt
          grep -E ':\s+ELF ' built.txt | cut -d: -f1 | xargs -d '\n' strip --strip-unneeded
          find dist -type f -exec file {} + > stripped.txt
          if grep -E 'ELF .*with debug_info' stripped.txt; then
            echo "::error::an ELF file in dist still carries debug info"
            exit 1
          fi
      # Packed where it was built: an uploaded directory loses symlinks and execute bits (macOS came out tripled).
      - name: Pack (Windows)
        if: matrix.platform == 'windows'
        run: 7z a -tzip -mx=9 "${env:ARTIFACT}.zip" .\build\windows\*
        env:
          ARTIFACT: ${{ matrix.artifact }}
      - name: Pack (Linux)
        if: matrix.platform == 'linux'
        run: |
          tar -cJf "$ARTIFACT.tar.xz" -C dist .
          tar -tvJf "$ARTIFACT.tar.xz" ./steamcleaner | grep -c '^-rwx'
        env:
          ARTIFACT: ${{ matrix.artifact }}
          XZ_OPT: "-9"
      - name: Pack (macOS)
        if: matrix.platform == 'macos'
        run: |
          tar --options 'xz:compression-level=9' -cJf "$ARTIFACT.tar.xz" -C dist .
          tar -tvJf "$ARTIFACT.tar.xz" > packed.txt
          grep -cE '^l.* \./steamcleaner\.app/Contents/Frameworks/App\.framework/Versions/Current -> A$' packed.txt
          grep -cE '^l.* \./steamcleaner\.app/Contents/Frameworks/FlutterMacOS\.framework/FlutterMacOS -> ' packed.txt
          grep -cE '^-rwx.* \./steamcleaner\.app/Contents/MacOS/steamcleaner$' packed.txt
        env:
          ARTIFACT: ${{ matrix.artifact }}
          COPYFILE_DISABLE: "1" # no AppleDouble `._` files in the archive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing + build provenance via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign archives (keyless)
        run: |
          for archive in artifacts/SteamCleaner-windows.zip artifacts/SteamCleaner-linux.tar.xz artifacts/SteamCleaner-macos.tar.xz; do
            cosign sign-blob --yes \
              --bundle "${archive}.sigstore.json" \
              "${archive}"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            artifacts/SteamCleaner-windows.zip
            artifacts/SteamCleaner-linux.tar.xz
            artifacts/SteamCleaner-macos.tar.xz
      - name: Export provenance as in-toto bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > artifacts/provenance.intoto.jsonl
          test -s artifacts/provenance.intoto.jsonl
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p unpacked/windows unpacked/linux unpacked/macos
          unzip -q artifacts/SteamCleaner-windows.zip -d unpacked/windows
          tar -xJf artifacts/SteamCleaner-linux.tar.xz -C unpacked/linux
          tar -xJf artifacts/SteamCleaner-macos.tar.xz -C unpacked/macos
          for platform in windows linux macos; do
            syft scan "dir:unpacked/${platform}" \
              -o "cyclonedx-json=artifacts/SteamCleaner-${platform}.sbom.cdx.json"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/SteamCleaner-windows.zip
            artifacts/SteamCleaner-windows.zip.sigstore.json
            artifacts/SteamCleaner-windows.sbom.cdx.json
            artifacts/SteamCleaner-linux.tar.xz
            artifacts/SteamCleaner-linux.tar.xz.sigstore.json
            artifacts/SteamCleaner-linux.sbom.cdx.json
            artifacts/SteamCleaner-macos.tar.xz
            artifacts/SteamCleaner-macos.tar.xz.sigstore.json
            artifacts/SteamCleaner-macos.sbom.cdx.json
            artifacts/provenance.intoto.jsonl
          generate_release_notes: true
